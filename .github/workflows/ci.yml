name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bali
          POSTGRES_PASSWORD: bali
          POSTGRES_DB: bali
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        # local 프로필(기본값)이 datasource를 postgres 서비스와 동일한 값(localhost:5432/bali, bali/bali)으로
        # 이미 고정해두고 있어 별도 오버라이드가 필요 없다. dev 프로필로 기동하는 테스트만 이 값들이 필요하다
        # (JWT_SECRET은 dev/prod에 기본값이 없다 — fix(security) JWT secret 커밋 참고)
        env:
          JWT_SECRET: ci-test-secret-key-at-least-32-bytes-long!!
          GOOGLE_CLIENT_ID: ci-test-google-client-id
          APPLE_BUNDLE_ID: com.bali.ci-test
          KAKAO_CLIENT_ID: ci-test-kakao-client-id
        run: ./gradlew test
