name: CD (dev)

on:
  push:
    branches: [develop]
    # 문서만 바뀐 병합은 서비스에 영향이 없으므로 배포하지 않는다 (코드가 함께 바뀌면 그대로 배포)
    paths-ignore:
      - 'docs/**'
      - '**.md'

# develop에 연속으로 push되면 CD 워크플로우가 겹쳐 실행되어 각자 force-new-deployment를
# 호출하면서 ECS 태스크를 서로 교체시키고, aws ecs wait services-stable이 10분 타임아웃을
# 넘겨 실패하는 문제가 있었다 (배포 자체는 결국 성공하지만 워크플로우만 실패로 표시됨).
# 최신 push의 배포만 진행되도록 이전 실행을 취소한다.
concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: bali-dev-bali-api
  ECS_CLUSTER: bali-dev-cluster
  ECS_SERVICE: bali-dev-bali-api
  BATCH_ECR_REPOSITORY: bali-dev-bali-batch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: 이미지 빌드 및 ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f bali-api/Dockerfile -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: ECS 서비스 재배포
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: 배포 안정화 대기
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

  # bali-batch는 상시 서비스가 아니라 EventBridge Scheduler가 주기적으로 RunTask하는 구조라
  # 재배포 트리거가 필요 없다 — 이미지를 새로 푸시해두면 다음 스케줄 실행 때 :latest를 그대로 pull한다
  deploy-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: 이미지 빌드 및 ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f bali-batch/Dockerfile -t $REGISTRY/$BATCH_ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$BATCH_ECR_REPOSITORY:latest .
          docker push $REGISTRY/$BATCH_ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$BATCH_ECR_REPOSITORY:latest
