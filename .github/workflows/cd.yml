name: CD (prod)

# main에 병합되면 운영(EC2)에 배포한다. develop은 CI(테스트)만 실행한다.
# 롤백은 Actions에서 이 워크플로우를 수동 실행(workflow_dispatch)하고 이전 커밋의 sha를 image_tag로 넣는다.
on:
  push:
    branches: [main]
    # 문서만 바뀐 병합은 서비스에 영향이 없으므로 배포하지 않는다 (코드가 함께 바뀌면 그대로 배포)
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '롤백할 이미지 태그(커밋 sha 전체). 비우면 선택한 ref를 새로 빌드해 배포'
        required: false
        default: ''

# 배포가 겹치면 서버에서 순서대로 실행되도록 큐에 쌓는다. 진행 중인 배포를 취소하면 blue/green 전환이 중간에 끊길 수 있어 취소하지 않는다
concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  API_REPOSITORY: bali-dev-bali-api
  BATCH_REPOSITORY: bali-dev-bali-batch
  DEPLOY_BUCKET: bali-dev-db-backup
  APP_URL: https://d2x91gr9oekfgj.cloudfront.net

jobs:
  # 테스트가 통과해야만 배포한다. CI 워크플로우를 그대로 호출해 같은 커밋에서 실행한다. 롤백(태그 지정)은 이미 검증된 이미지라 건너뛴다
  test:
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  # 운영 서버(EC2 t4g)가 arm64라서 arm64 러너에서 네이티브로 빌드한다. 태그는 커밋 sha로만 붙인다(:latest에 의존하지 않음)
  build:
    needs: test
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: API 이미지 빌드 및 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f bali-api/Dockerfile -t $REGISTRY/$API_REPOSITORY:${{ github.sha }} .
          docker push $REGISTRY/$API_REPOSITORY:${{ github.sha }}

      - name: Batch 이미지 빌드 및 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f bali-batch/Dockerfile -t $REGISTRY/$BATCH_REPOSITORY:${{ github.sha }} .
          docker push $REGISTRY/$BATCH_REPOSITORY:${{ github.sha }}

  deploy:
    needs: build
    # build가 건너뛰어진 경우(롤백)에도 실행하고, 앞 단계가 실패하면 실행하지 않는다
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 스크립트를 S3에 동기화
        run: aws s3 sync infra/deploy s3://$DEPLOY_BUCKET/deploy/ --delete --exclude env.example

      - name: 서버에서 블루/그린 배포 실행 (SSM)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=bali-dev-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE_ID" != "None" ] || { echo "실행 중인 운영 인스턴스를 찾지 못했습니다" >&2; exit 1; }

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters "commands=[\"aws s3 sync s3://$DEPLOY_BUCKET/deploy/ /opt/bali/ --quiet\",\"chmod +x /opt/bali/*.sh\",\"cd /opt/bali && ./deploy.sh $TAG $TAG\"]" \
            --query Command.CommandId --output text)

          # 헬스체크 대기(최대 180초) + 전환 + 이전 버전 정리를 합쳐 보통 3~4분 걸린다. 최대 15분까지 기다린다
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            case "$STATUS" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -30
          [ "$STATUS" = "Success" ] || { echo "배포 실패: $STATUS (헬스체크 실패 시 기존 버전이 그대로 유지됩니다)" >&2; exit 1; }

      - name: 외부 헬스체크
        run: curl -fsS --retry 5 --retry-delay 5 "$APP_URL/actuator/health"
