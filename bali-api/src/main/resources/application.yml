server:
  port: 8080

bali:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32bytes!!}
    expiration-millis: 3600000

spring:
  application:
    name: bali-api
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

management:
  endpoints:
    web:
      exposure:
        include: health
