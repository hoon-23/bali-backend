server:
  port: 8080

bali:
  plan:
    # 무료 플랜 한도. 기본 꺼짐(모두 무제한). 결제(PRO 승격) 경로를 연 뒤 true로 켠다
    limits-enabled: false
    free:
      max-templates: 5
      max-personal-exercises: 10
      monthly-insights-allowed: false
  jwt:
    # 기본값 없음: local 프로필에서만 application-local.yml이 개발용 값을 채운다.
    # dev/prod는 JWT_SECRET 미설정 시 기동 실패해야 한다 (알려진 기본 시크릿으로 조용히 뜨는 것 방지)
    secret: ${JWT_SECRET}
    expiration-millis: 3600000
    refresh-expiration-millis: 2592000000
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    apple:
      bundle-id: ${APPLE_BUNDLE_ID}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}

spring:
  application:
    name: bali-api
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    name: logs/bali-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
