server:
  port: 8080

bali:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32bytes!!}
    expiration-millis: 3600000
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    apple:
      bundle-id: ${APPLE_BUNDLE_ID}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}

spring:
  application:
    name: bali-api
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
