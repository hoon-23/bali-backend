# 활성 색상(blue/green)을 가리키는 upstream은 deploy.sh가 생성한다
include /etc/nginx/dyn/active-upstream.conf;

server {
    listen 80;

    # CloudFront가 붙인 헤더가 아니면 거부 (ALB 리스너 규칙을 대체). 값은 deploy.sh가 생성한다
    include /etc/nginx/dyn/origin-verify.conf;

    location / {
        proxy_pass http://bali_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
        # 전환 직전 연결이 끊긴 경우 새 컨테이너로 한 번 재시도한다
        proxy_next_upstream error timeout http_502 http_503;
    }
}
