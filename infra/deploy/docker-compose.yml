# EC2에서 상시 떠 있는 서비스(postgres, nginx). bali-api는 deploy.sh가 blue/green 컨테이너로 따로 관리한다.
name: bali

networks:
  default:
    name: bali

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: bali
      POSTGRES_USER: bali
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/bali/pgdata:/var/lib/postgresql/data
    # 컨테이너 밖에서는 호스트 localhost로만 접근 (백업, 복원용). 외부 노출 없음
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bali -d bali"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    image: nginx:1.27
    restart: always
    ports:
      - "80:80"
    volumes:
      - /opt/bali/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/bali/nginx/dyn:/etc/nginx/dyn:ro
